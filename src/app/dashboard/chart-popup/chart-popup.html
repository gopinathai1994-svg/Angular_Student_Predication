<div class="chart-popup">
  <div class="popup-header">
    <div class="header-content">
      <span class="popup-subtitle">Dashboard Analytics</span>
      <h2>{{ chartTitle }}</h2>
    </div>

    <!-- Premium Close Button -->
    <button class="close-btn" type="button" (click)="close()" aria-label="Close">
      <svg class="close-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="chart-container">
    <canvas
      baseChart
      [data]="chartData"
      [type]="chartType"
      [options]="chartOptions">
    </canvas>
  </div>
</div>
